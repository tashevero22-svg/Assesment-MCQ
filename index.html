<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment_MCQ - HIPAA & PHI</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:0 auto;padding:12px;background:#f0f2f5}
.top{background:#1a73e8;color:#fff;padding:18px;border-radius:12px;text-align:center}
.card{background:#fff;padding:14px;margin:10px 0;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
input[type="text"],input[type="date"]{padding:10px;border:1px solid #ccc;border-radius:6px;width:46%}
label{display:block;margin:5px 0;padding:9px;border:1px solid #eee;border-radius:6px;cursor:pointer}
label:hover{background:#e8f0fe}
label.selected{background:#c8e6c9;border:2px solid #25D366;font-weight:bold}
.btn-whatsapp{background:#25D366;color:#fff;font-weight:bold;padding:16px;border:none;border-radius:8px;font-size:18px;cursor:pointer;width:100%;margin-top:10px}
.result-banner{background:#fff3cd;border:2px solid #ff9800;padding:12px;border-radius:8px;text-align:center;display:none}
</style>
</head>
<body>
<div class="top">
<h2>HIPAA & PHI - Assessment MCQ</h2>
<p>40 Multiple Choice Questions</p>
</div>
<div id="viewBanner" class="card result-banner"></div>
<div class="card">
<b>Name:</b> <input type="text" id="name" placeholder="Enter Your Full Name">
<b>Date:</b> <input type="date" id="date">
<p>Instructions: Choose the correct answer for each question.</p>
</div>
<div id="quiz"></div>
<div class="card">
<button class="btn-whatsapp" id="submitBtn" onclick="submitToWhatsApp()">📤 SUBMIT TO 9016953417</button>
</div>
<script>
const questions=[
{q:"What does HIPAA stand for?",o:["Health Insurance Privacy and Protection Act","Health Insurance Portability and Accountability Act","Health Information Protection and Accountability Act","Health Insurance Patient Assistance Act"]},
{q:"What is the primary purpose of HIPAA?",o:["To increase hospital revenue","To protect patient privacy and the security of PHI","To reduce insurance premiums","To manage employee attendance"]},
{q:"What does PHI stand for?",o:["Personal Health Insurance","Protected Health Information","Patient Health Insurance","Private Healthcare Information"]},
{q:"Which of the following is considered PHI?",o:["A patient's medical record","A company's financial report","An employee's attendance sheet","A hospital's electricity bill"]},
{q:"Which HIPAA rule governs the use and disclosure of PHI?",o:["Security Rule","Privacy Rule","Billing Rule","Insurance Rule"]},
{q:"Which HIPAA rule safeguards electronic PHI (ePHI)?",o:["Privacy Rule","Security Rule","Breach Rule","Billing Rule"]},
{q:"What does the HIPAA Breach Notification Rule require?",o:["Employees to change jobs after a breach","Covered entities to report certain breaches of unsecured PHI","Patients to pay for data breaches","Hospitals to stop using electronic records"]},
{q:"Which of the following is an example of demographic information linked to health?",o:["Patient's favorite color","Patient's name and address","Hospital building number","Employee ID only"]},
{q:"Why is protecting PHI important?",o:["It builds patient trust","It increases office working hours","It eliminates all medical expenses","It prevents employees from taking leave"]},
{q:"What does COBRA allow eligible employees to do?",o:["Continue health insurance coverage after certain job loss or reduction in work hours","Receive free medical treatment forever","Avoid paying insurance premiums","Change their medical records"]},
{q:"COBRA coverage is usually available for:",o:["Only 1 month","Usually 18 months, sometimes up to 36 months","Exactly 5 years","Unlimited time"]},
{q:"Under COBRA, who generally pays the insurance premium?",o:["The employer only","The government only","The patient/employee","The hospital"]},
{q:"What is the Affordable Care Act commonly known as?",o:["Medicare","Medicaid","Obamacare","COBRA"]},
{q:"Which is a key feature of the Affordable Care Act?",o:["Insurance marketplaces","Free insurance for everyone","Elimination of all medical bills","No preventive services"]},
{q:"What is the 'Minimum Necessary' principle?",o:["Access all patient records","Access only the PHI needed to perform your job","Share all available PHI with coworkers","Print every patient record"]},
{q:"Which of the following is a proper practice when using a PMS system?",o:["Access it for personal curiosity","Share your password with coworkers","Access it only for work-related tasks","Download patient information to a personal device"]},
{q:"What should you do if you receive a suspicious login notification?",o:["Ignore it","Share your credentials","Report it immediately","Delete the system"]},
{q:"Which of the following is NOT an appropriate way to share PHI?",o:["Authorized secure system","Secure File Transfer Protocol (SFTP)","Personal WhatsApp","Approved company email"]},
{q:"What can happen to an employee for a serious or intentional HIPAA violation?",o:["Promotion","Termination of employment","Salary increase","Extra vacation"]},
{q:"What is one possible consequence for an organization that violates HIPAA?",o:["Fines and compliance audits","Free insurance","Automatic tax benefits","Increased patient benefits"]},
{q:"What does RCM stand for?",o:["Revenue Care Management","Revenue Cycle Management","Revenue Claim Monitoring","Revenue Coding Management"]},
{q:"What is the first stage of the Revenue Cycle Management process?",o:["Medical Coding","Patient Scheduling","Claim Adjudication","Payment Posting"]},
{q:"What is an important activity during patient scheduling?",o:["Denying claims","Assigning the correct provider and appointment slot","Posting insurance payments","Generating EOBs"]},
{q:"Which information is commonly captured during patient scheduling?",o:["Patient demographics","Claim denial reason","Payment adjustment","EOB details"]},
{q:"What is the main purpose of eligibility and benefits verification?",o:["To determine whether the patient's insurance coverage is active and what benefits are available","To collect outstanding patient balances","To create medical codes","To deny claims"]},
{q:"What is the purpose of pre-authorization?",o:["To obtain required approval from the insurance company before certain services","To post patient payments","To generate patient statements","To follow up on old claims"]},
{q:"What is the purpose of the patient visit/check-in stage?",o:["To update patient information and obtain required consent forms","To submit claims","To analyze denials","To post payments"]},
{q:"Why is medical transcription important?",o:["It creates accurate written documentation from recorded physician notes","It determines insurance premiums","It collects patient payments","It approves insurance claims"]},
{q:"Which codes are primarily used to identify a patient's diagnosis?",o:["CPT codes","HCPCS codes","ICD codes","EOB codes"]},
{q:"Which codes describe procedures or services performed?",o:["ICD codes","CPT/HCPCS codes","EOB codes","COBRA codes"]},
{q:"What is the main purpose of charge capture and claims submission?",o:["To record services provided and submit claims to insurance","To schedule patients","To collect patient balances only","To hire medical coders"]},
{q:"What happens during claim adjudication?",o:["The patient schedules an appointment","The insurance company reviews the claim and determines the payment outcome","The provider records a voice note","The patient changes their address"]},
{q:"What document communicates an insurance company's claim/payment decision?",o:["PMS","EOB","ICD","COBRA"]},
{q:"What is the primary purpose of payment posting?",o:["To record insurance and patient payments accurately","To schedule appointments","To obtain prior authorization","To create diagnosis codes"]},
{q:"What can happen if a payment is posted incorrectly?",o:["The account balance may become incorrect","The patient automatically gets free treatment","The claim is always approved","The insurance coverage increases"]},
{q:"What is the main responsibility of Accounts Receivable (AR) follow-up?",o:["Monitoring unpaid claims and following up with insurance companies","Creating medical records","Scheduling new patients","Assigning diagnosis codes"]},
{q:"What is an aging report used for in AR?",o:["To monitor outstanding claims based on how long they have been unpaid","To record patient birthdays","To create medical codes","To schedule appointments"]},
{q:"What is denial management?",o:["The process of identifying, analyzing, and resolving denied claims","The process of scheduling patients","The process of recording physician notes","The process of collecting premiums"]},
{q:"Which of the following is an activity in denial management?",o:["Analyzing denial reasons and correcting claim errors","Booking appointments","Recording patient demographics","Assigning provider slots"]},
{q:"What is the purpose of patient statements and collections?",o:["To bill patients for their remaining balances and collect payments","To assign diagnosis codes","To verify insurance eligibility only","To adjudicate insurance claims"]},
];
let container=document.getElementById('quiz');
questions.forEach((q,i)=>{
 let d=document.createElement('div');
 d.className='card';
 d.innerHTML=`<b>${i+1}. ${q.q}</b>`+q.o.map((opt,j)=>`<label id="l${i}_${j}"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(97+j)}) ${opt}</label>`).join('');
 container.appendChild(d);
});
window.onload=function(){
 const params=new URLSearchParams(window.location.search);
 if(params.has('ans')){
   let name=params.get('name')||'';
   let date=params.get('date')||'';
   let ans=params.get('ans')||'';
   document.getElementById('name').value=name;
   document.getElementById('date').value=date;
   document.getElementById('viewBanner').style.display='block';
   document.getElementById('viewBanner').innerHTML=`<b>👁️ Viewing Submission</b><br>Name: <b>${name}</b> | Date: ${date}<br>Answers highlighted in GREEN`;
   document.getElementById('submitBtn').style.display='none';
   for(let i=0;i<ans.length && i<40;i++){
     let v=ans[i];
     if(v!=='9'){
       let radio=document.querySelector(`input[name="q${i}"][value="${v}"]`);
       if(radio){ radio.checked=true; document.getElementById(`l${i}_${v}`).classList.add('selected'); }
     }
   }
 }
};
function submitToWhatsApp(){
 let name=document.getElementById('name').value.trim();
 let date=document.getElementById('date').value;
 if(!name){alert('Please enter your Name first!');return;}
 let ansString="";
 let shortAns=[];
 questions.forEach((q,i)=>{
  let sel=document.querySelector(`input[name="q${i}"]:checked`);
  let ansIndex=sel?parseInt(sel.value):9;
  ansString+=ansIndex;
  shortAns.push(`Q${i+1}:${ansIndex===9?'X':String.fromCharCode(97+ansIndex)}`);
 });
 let resultLink=`https://assesment-mcq.vercel.app?name=${encodeURIComponent(name)}&date=${encodeURIComponent(date)}&ans=${ansString}`;
 let msg=`*HIPAA & RCM Assessment Submission*\n\n*Name:* ${name}\n*Date:* ${date}\n\n*Answers:* ${shortAns.join(', ')}\n\n*Click to view FULL paper with your selected answers:*\n${resultLink}`;
 let url=`https://wa.me/919016953417?text=${encodeURIComponent(msg)}`;
 window.open(url,'_blank');
}
</script>
</body>
</html>
